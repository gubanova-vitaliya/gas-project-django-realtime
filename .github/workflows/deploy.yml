name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Измените на master, если используете master
    paths:
      - 'gase-frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:  # Позволяет запускать вручную

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: gase-frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./gase-frontend
        run: npm ci
      
      - name: Build for GitHub Pages
        working-directory: ./gase-frontend
        env:
          # Используйте secret VITE_API_URL для URL бэкенда
          # Или установите здесь напрямую, если не используете secrets
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_REPO_NAME: ${{ github.event.repository.name }}
          VITE_GITHUB_PAGES: 'true'
        run: npm run build:gh-pages
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './gase-frontend/dist'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

