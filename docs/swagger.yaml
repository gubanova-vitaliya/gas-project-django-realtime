basePath: /
definitions:
  handler.CalculationResponse:
    description: Calculation response object
    properties:
      creator_id:
        example: 1
        type: integer
      date_create:
        type: string
      id:
        example: 1
        type: integer
      status:
        example: draft
        type: string
      text:
        example: Calculation description
        type: string
    type: object
  handler.CreateCalculationRequest:
    description: Create calculation request
    properties:
      text:
        example: Calculation description
        type: string
      title:
        example: My Calculation
        type: string
    required:
    - title
    type: object
  handler.apiCalcUpdate:
    properties:
      text:
        type: string
    type: object
  handler.apiLoginReq:
    properties:
      login:
        type: string
      password:
        type: string
    required:
    - login
    - password
    type: object
  handler.apiLoginResp:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      token_type:
        type: string
      user:
        $ref: '#/definitions/handler.userResp'
    type: object
  handler.apiMMUpdateReq:
    properties:
      position:
        type: integer
      quantity:
        type: integer
      sound:
        type: boolean
    type: object
  handler.apiRegisterReq:
    properties:
      email:
        type: string
      login:
        type: string
      name:
        type: string
      password:
        type: string
    required:
    - login
    - name
    - password
    type: object
  handler.apiUpdateMeReq:
    properties:
      login:
        type: string
    type: object
  handler.updateRoleRequest:
    properties:
      role:
        type: string
    required:
    - role
    type: object
  handler.userResp:
    properties:
      email:
        type: string
      login:
        type: string
      name:
        type: string
      role:
        type: string
      uuid:
        type: string
    type: object
  pkg.loginReq:
    description: Login credentials
    properties:
      login:
        example: testuser
        type: string
      password:
        example: password123
        type: string
    type: object
  pkg.loginResp:
    description: Login response with JWT token
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      expires_in:
        description: 24 hours in seconds
        example: 86400
        type: integer
      token_type:
        example: Bearer
        type: string
    type: object
  pkg.pingResp:
    description: Ping response
    properties:
      status:
        example: pong
        type: string
    type: object
  pkg.registerReq:
    description: User registration data
    properties:
      email:
        example: john@example.com
        type: string
      name:
        example: John Doe
        type: string
      pass:
        example: securepassword
        type: string
    type: object
  pkg.registerResp:
    description: Registration response
    properties:
      ok:
        example: true
        type: boolean
    type: object
host: localhost:8080
info:
  contact:
    email: support@gaseproject.com
    name: API Support
    url: http://localhost:8080
  description: API для управления газами и расчетами
  license:
    name: MIT
  title: GaseProject API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT token
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.apiLoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.apiLoginResp'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: User login
      tags:
      - Users
  /api/auth/login-session:
    post:
      consumes:
      - application/json
      description: Authenticate user with session (not implemented)
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.apiLoginReq'
      produces:
      - application/json
      responses:
        "501":
          description: Not Implemented
          schema:
            additionalProperties:
              type: string
            type: object
      summary: User login with session
      tags:
      - Users
  /api/auth/logout:
    post:
      description: Logout current user
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: User logout
      tags:
      - Users
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account
      parameters:
      - description: Registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.apiRegisterReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - Users
  /api/calculations:
    get:
      description: Get list of all calculations - requires moderator role
      parameters:
      - description: Filter by status
        in: query
        name: status
        type: string
      - description: Filter by date from
        in: query
        name: date_from
        type: string
      - description: Filter by date to
        in: query
        name: date_to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List all calculations (Moderator only)
      tags:
      - Calculations
    post:
      consumes:
      - application/json
      description: Create a new calculation
      parameters:
      - description: Calculation data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateCalculationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.CalculationResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create calculation
      tags:
      - Calculations
  /api/calculations/{id}:
    delete:
      description: Delete calculation by ID
      parameters:
      - description: Calculation ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete calculation (logical)
      tags:
      - Calculations
    get:
      description: Get calculation details by ID
      parameters:
      - description: Calculation ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get calculation details
      tags:
      - Calculations
    put:
      consumes:
      - application/json
      description: Update calculation fields
      parameters:
      - description: Calculation ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.apiCalcUpdate'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update calculation
      tags:
      - Calculations
  /api/calculations/{id}/complete:
    put:
      description: Mark calculation as completed
      parameters:
      - description: Calculation ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Complete calculation (Moderator only)
      tags:
      - Calculations
  /api/calculations/{id}/reject:
    put:
      description: Reject calculation
      parameters:
      - description: Calculation ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Reject calculation (Moderator only)
      tags:
      - Calculations
  /api/calculations/{id}/submit:
    post:
      description: Submit calculation for moderation
      parameters:
      - description: Calculation ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Submit calculation
      tags:
      - Calculations
  /api/mm/gas/{id}:
    delete:
      description: Remove gas from draft calculation
      parameters:
      - description: Gas ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Remove gas from draft
      tags:
      - Calculations
    put:
      consumes:
      - application/json
      description: Update sound, quantity or position for gas in calculation
      parameters:
      - description: Gas ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.apiMMUpdateReq'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update gas calculation fields
      tags:
      - Calculations
  /api/my-calculations:
    get:
      description: Get list of calculations for authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.CalculationResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get user's calculations
      tags:
      - Calculations
  /api/users:
    get:
      description: Get list of all users (Admin/Moderator only)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handler.userResp'
            type: array
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get all users
      tags:
      - Users
  /api/users/{uuid}:
    delete:
      description: Delete user by UUID (Admin only)
      parameters:
      - description: User UUID
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete user
      tags:
      - Users
  /api/users/{uuid}/role:
    put:
      consumes:
      - application/json
      description: Update user role by UUID (Admin only)
      parameters:
      - description: User UUID
        in: path
        name: uuid
        required: true
        type: string
      - description: New role
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.updateRoleRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update user role
      tags:
      - Users
  /api/users/me:
    get:
      description: Get current user profile information
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.userResp'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get user profile
      tags:
      - Users
    put:
      consumes:
      - application/json
      description: Update current user information
      parameters:
      - description: Update data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.apiUpdateMeReq'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update user profile
      tags:
      - Users
  /login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT token
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/pkg.loginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.loginResp'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: User login
      tags:
      - Auth
  /ping:
    get:
      description: Check if server is running
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.pingResp'
      summary: Ping endpoint
      tags:
      - Tests
  /sign_up:
    post:
      consumes:
      - application/json
      description: Register a new user
      parameters:
      - description: Registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/pkg.registerReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg.registerResp'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: User registration
      tags:
      - Auth
schemes:
- http
securityDefinitions:
  BearerAuth:
    description: JWT Token
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
